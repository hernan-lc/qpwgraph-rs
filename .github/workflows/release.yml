name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate release tag and workspace version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like vX.Y.Z or vX.Y.Z-rc.1: $RELEASE_TAG" >&2
            exit 1
          fi

          tag_version="${RELEASE_TAG#v}"
          package_version="$(cargo metadata --no-deps --format-version=1 | jq -r '.packages[] | select(.name == "pw-graph-app") | .version')"
          if [[ -z "$package_version" || "${tag_version%%-*}" != "$package_version" ]]; then
            echo "Tag $RELEASE_TAG does not match pw-graph-app version $package_version" >&2
            exit 1
          fi

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang cmake libclang-dev libasound2-dev libopus-dev libpipewire-0.3-dev libgtk-3-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run locked workspace tests
        run: cargo test --workspace --all-features --locked

      - name: Build release binary
        run: cargo build --release --locked -p pw-graph-app

      - name: Package release assets
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${RELEASE_TAG#v}"
          target="$(rustc -vV | sed -n 's/^host: //p')"
          package_name="qpwgraph-rs-${tag_version}-${target}"
          staging_dir="${RUNNER_TEMP}/qpwgraph-rs-release"
          asset_dir="${GITHUB_WORKSPACE}/dist"
          package_root="${staging_dir}/${package_name}"

          rm -rf "$staging_dir" "$asset_dir"
          mkdir -p "$package_root"

          install -Dm755 target/release/qpwgraph-rs \
            "$package_root/bin/qpwgraph-rs"
          install -Dm644 README.md \
            "$package_root/README.md"
          install -Dm644 packaging/README.md \
            "$package_root/PACKAGING.md"
          install -Dm644 docs/adaptive-noise-reduction.md \
            "$package_root/share/doc/qpwgraph-rs/adaptive-noise-reduction.md"
          install -Dm644 packaging/qpwgraph-rs.desktop \
            "$package_root/share/applications/qpwgraph-rs.desktop"
          install -Dm644 packaging/io.github.qpwgraph_rs.metainfo.xml \
            "$package_root/share/metainfo/io.github.qpwgraph_rs.metainfo.xml"
          install -Dm644 vendor/nnnoiseless/COPYING \
            "$package_root/share/licenses/qpwgraph-rs/nnnoiseless-COPYING"

          mkdir -p "$asset_dir"
          archive="${package_name}.tar.gz"
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime='UTC 1970-01-01' \
            -czf "$asset_dir/$archive" \
            -C "$staging_dir" "$package_name"
          (cd "$asset_dir" && sha256sum "$archive" > "${archive}.sha256")

          echo "Release assets:"
          ls -lh "$asset_dir"

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            release_flags=(--verify-tag --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" "${release_flags[@]}"
          fi
