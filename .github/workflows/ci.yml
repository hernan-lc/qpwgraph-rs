name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Prevent legacy UI dependencies
        shell: bash
        run: |
          set -euo pipefail
          if rg -n '(^|[^[:alnum:]_])(egui|eframe|egui_extras)([^[:alnum:]_]|$)' \
            Cargo.toml crates --glob '*.toml' --glob '*.rs'; then
            echo "legacy desktop UI dependency/source usage was reintroduced" >&2
            exit 1
          fi
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libclang-dev libasound2-dev libopus-dev libpipewire-0.3-dev libgtk-3-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --all-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Minimal Slint application build
        run: cargo check -p pw-graph-app --no-default-features
      - name: PipeWire-only Slint application build
        run: cargo check -p pw-graph-app --no-default-features --features pipewire
      - name: ALSA-only Slint application build
        run: cargo check -p pw-graph-app --no-default-features --features alsa
      - name: PipeWire and ALSA Slint application build
        run: cargo check -p pw-graph-app --no-default-features --features pipewire,alsa
      - name: PipeWire and relay Slint application build
        run: cargo check -p pw-graph-app --no-default-features --features pipewire,relay
      - name: Full Slint application build
        run: cargo check -p pw-graph-app --all-features
      - name: Locked release build
        run: cargo build --release --locked -p pw-graph-app
