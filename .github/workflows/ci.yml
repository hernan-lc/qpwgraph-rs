name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang cmake libclang-dev libasound2-dev libopus-dev libpipewire-0.3-dev libgtk-3-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --all-features
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Minimal feature build
        run: cargo check -p pw-graph-app --no-default-features
      - name: PipeWire-only feature build
        run: cargo check -p pw-graph-app --no-default-features --features pipewire
