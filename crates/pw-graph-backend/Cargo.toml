[package]
name = "pw-graph-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
[features]
default = ["in-memory"]
in-memory = []
pipewire = ["dep:pipewire"]
relay = ["dep:pw-graph-relay"]

[dependencies]
pw-graph-core = { path = "../pw-graph-core" }
pw-graph-effects = { path = "../pw-graph-effects" }
thiserror.workspace = true
pw-graph-utils = { path = "../pw-graph-utils" }

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { workspace = true, optional = true }
pw-graph-relay = { path = "../pw-graph-relay", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = [
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
windows-core.workspace = true
