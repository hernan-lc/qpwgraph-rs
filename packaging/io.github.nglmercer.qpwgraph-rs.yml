id: io.github.nglmercer.qpwgraph-rs
default-branch: stable
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm18
command: qpwgraph-rs
finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pipewire
  - --socket=session-bus
  - --talk-name=org.kde.StatusNotifierWatcher
  - --device=dri
  # The ALSA Sequencer backend needs access to the host sound devices.
  - --device=all
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/gir-1.0
  - '*.a'
  - /man
modules:
  - name: qpwgraph-rs
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm18/bin
      env:
        CARGO_HOME: /run/build/qpwgraph-rs/cargo
        CARGO_NET_OFFLINE: 'true'
        LIBCLANG_PATH: /usr/lib/sdk/llvm18/lib
        BINDGEN_EXTRA_CLANG_ARGS: "-I/usr/include/x86_64-linux-gnu"
    build-commands:
      - cargo build --offline --release --locked -p pw-graph-app --features pipewire
      - install -Dm755 target/release/qpwgraph-rs /app/bin/qpwgraph-rs
      - install -Dm644 packaging/io.github.nglmercer.qpwgraph-rs.desktop /app/share/applications/io.github.nglmercer.qpwgraph-rs.desktop
      - install -Dm644 packaging/io.github.nglmercer.qpwgraph-rs.metainfo.xml /app/share/metainfo/io.github.nglmercer.qpwgraph-rs.metainfo.xml
      - install -Dm644 packaging/io.github.nglmercer.qpwgraph-rs.svg /app/share/icons/hicolor/scalable/apps/io.github.nglmercer.qpwgraph-rs.svg
    sources:
      # Build the checked-out release tag, so the bundle always contains the
      # same source as the tarball and AppImage produced by the release job.
      - type: dir
        path: ..
      - cargo-sources.json
