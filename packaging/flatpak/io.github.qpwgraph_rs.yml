app-id: io.github.qpwgraph_rs
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: qpwgraph-rs
finish-args:
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --socket=session-bus
  - --filesystem=xdg-config/qpwgraph-rs:create
modules:
  - name: qpwgraph-rs
    buildsystem: simple
    build-commands:
      - cargo build --release --locked -p pw-graph-app
      - install -Dm755 target/release/qpwgraph-rs /app/bin/qpwgraph-rs
      - install -Dm644 packaging/qpwgraph-rs.desktop /app/share/applications/qpwgraph-rs.desktop
      - install -Dm644 packaging/io.github.qpwgraph_rs.metainfo.xml /app/share/metainfo/io.github.qpwgraph_rs.metainfo.xml
    sources:
      - type: dir
        path: ..
