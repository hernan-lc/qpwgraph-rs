[workspace]
resolver = "2"
members = [
    "crates/pw-graph-core",
    "crates/pw-graph-backend",
    "crates/pw-graph-alsamidi",
    "crates/pw-graph-command",
    "crates/pw-graph-patchbay",
    "crates/pw-graph-config",
    "crates/pw-graph-i18n",
    "crates/pw-graph-ui",
    "crates/pw-graph-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["qpwgraph-rs contributors"]

[workspace.dependencies]
anyhow = "1.0"
eframe = { version = "0.29", default-features = false, features = ["glow", "x11"] }
egui = "0.29"
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
