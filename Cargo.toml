[workspace]
resolver = "2"
members = [
    "crates/pw-graph-core",
    "crates/pw-graph-effects",
    "crates/pw-graph-backend",
    "crates/pw-graph-alsamidi",
    "crates/pw-graph-command",
    "crates/pw-graph-patchbay",
    "crates/pw-graph-config",
    "crates/pw-graph-i18n",
    "crates/pw-graph-ui",
    "crates/pw-graph-app",
    "crates/pw-graph-relay",
    "crates/pw-graph-relay-sdk",
    "crates/pw-graph-relay-android",
    "vendor/nnnoiseless",
]

[patch.crates-io]
audiopus_sys = { path = "vendor/audiopus_sys" }

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["qpwgraph-rs contributors"]

[workspace.dependencies]
anyhow = "1.0"
eframe = { version = "0.29", default-features = false, features = ["glow", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", default-features = false, features = ["svg"] }
rfd = "0.15"
quick-xml = "0.41"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
toml = "0.8"
pipewire = "0.8"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
opus = "0.3"
socket2 = "0.5"
mdns-sd = "0.13"
netdev = "0.31"
qrcode = { version = "0.14", default-features = false }
